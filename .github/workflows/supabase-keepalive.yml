# Mantiene activo tu proyecto de Supabase (el plan gratis lo pausa tras ~7 días con poca actividad).
# Cómo usarlo:
#  1. En tu repositorio de GitHub crea la carpeta .github/workflows/ y guarda este archivo ahí.
#  2. En el repo: Settings → Secrets and variables → Actions → New repository secret. Crea dos:
#       SUPABASE_URL  = la Project URL (https://xxxx.supabase.co)
#       SUPABASE_KEY  = la clave publishable o anon (la misma de config.js)
#  3. Pestaña Actions → "Supabase keepalive" → Run workflow, para probarlo una vez.
# Ojo: GitHub desactiva las tareas programadas de un repositorio sin actividad por ~60 días;
# si pasa, vuelve a activarlas desde la pestaña Actions.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 9 */3 * *"   # cada 3 días
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/pphy_notes?select=id&limit=1")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
