name: Actualizar estadisticas de radio

on:
  schedule:
    # lunes 09:00 UTC = ~05:00-06:00 en Chile segun horario de verano/invierno
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrapear perfil publico de YouTube Music
        run: python radio/scrape.py

      - name: Commitear radio/data.json si cambio
        run: |
          git config user.name "radio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio/data.json
          git diff --cached --quiet || git commit -m "radio: actualizar estadisticas semanales"
          git push
